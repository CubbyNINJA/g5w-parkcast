// The parking gate (OD-131): plain Java with no Android imports, compiled for Java 7 so it can later run on
// the head unit's Android 4.4 (OD-132). Its S2 scenarios run with Cucumber-JVM (OD-133) from specs/features.
plugins {
    id 'java'
    // The S2 harness, World and step definitions are test fixtures, so receiver/core can rerun S2's
    // scenarios against its adapters (OD-189). Fixtures never reach a release build.
    id 'java-test-fixtures'
}

repositories {
    mavenCentral()
}

dependencies {
    testFixturesApi platform('io.cucumber:cucumber-bom:7.20.1')
    testFixturesApi 'io.cucumber:cucumber-java'
    testFixturesApi 'io.cucumber:cucumber-picocontainer'
    testImplementation platform('io.cucumber:cucumber-bom:7.20.1')
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileJava') {
    options.release = 7
    options.compilerArgs += ['-Xlint:-options']
    options.encoding = 'UTF-8'
}

tasks.named('compileTestJava') {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('compileTestFixturesJava') {
    options.release = 17
    options.encoding = 'UTF-8'
}

def featuresDir = rootProject.file('specs/features')
// The Cucumber feature files are listed in specs/java-features.txt (OD-177); pytest-bdd runs the rest. This
// runner takes only the lines marked "gate" (OD-189), so the receiver's files 13 and 15 never run here.
def javaFeatures = rootProject.file('specs/java-features.txt').readLines('UTF-8')
        .collect { it.trim() }.findAll { it && !it.startsWith('#') }
        .collect { it.split(/\s+/) }
        .each { if (it.length != 2 || !(it[0] in ['gate', 'core'])) throw new GradleException("specs/java-features.txt: bad line '${it.join(' ')}'") }
        .findAll { it[0] == 'gate' }
        .collect { new File(featuresDir, it[1]) }
        .each { if (!it.exists()) throw new GradleException("specs/java-features.txt names a missing file: ${it.name}") }
        .collect { it.absolutePath }.join(',')

test {
    useJUnitPlatform()
    // Only S2's synthetic scenarios run here; @unit evidence checks come last (OD-135).
    systemProperty 'cucumber.features', System.getProperty('cucumber.features', javaFeatures)
    systemProperty 'cucumber.glue', 'parkcast.gate.steps'
    systemProperty 'cucumber.filter.tags', System.getProperty('cucumber.filter.tags', '@offline')
    systemProperty 'cucumber.plugin', 'summary'
    inputs.dir(featuresDir)
    testLogging {
        events 'failed'
        exceptionFormat 'short'
    }
}
